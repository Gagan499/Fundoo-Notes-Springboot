spring.application.name=fundoo-api
spring.datasource.url=jdbc:mysql://fundo-notes.cs1404isqts6.us-east-1.rds.amazonaws.com:3306/Fundo_notes
spring.datasource.username=admin
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8080
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.reset.expiration=900000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true;
spring.mail.properties.mail.smtp.starttls.enable=true

app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL}

management.endpoints.web.exposure.include=* 